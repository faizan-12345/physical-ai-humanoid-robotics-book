<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Humanoid Robotics Book - System Architecture</text>

  <!-- Docusaurus Book Box -->
  <rect x="50" y="100" width="200" height="100" fill="#e0f7fa" stroke="#000" stroke-width="2"/>
  <text x="150" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Docusaurus Book</text>
  <text x="150" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Frontend</text>

  <!-- Chatbot Component Box -->
  <rect x="50" y="250" width="200" height="100" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
  <text x="150" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Chatbot UI</text>
  <text x="150" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(Integrated in Docusaurus)</text>

  <!-- RAG Backend Box -->
  <rect x="300" y="100" width="200" height="150" fill="#e8f5e9" stroke="#000" stroke-width="2"/>
  <text x="400" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">RAG Backend</text>
  <text x="400" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(FastAPI)</text>
  <!-- API Endpoints inside RAG Backend -->
  <rect x="320" y="170" width="160" height="20" fill="#c8e6c9" stroke="#000" stroke-width="1"/>
  <text x="400" y="185" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">/embed, /query, /selected-text-query</text>

  <!-- Qdrant DB Box -->
  <rect x="550" y="100" width="200" height="100" fill="#fff3e0" stroke="#000" stroke-width="2"/>
  <text x="650" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Qdrant Vector DB</text>
  <text x="650" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(Cloud)</text>

  <!-- Neon Postgres Box -->
  <rect x="550" y="250" width="200" height="100" fill="#fce4ec" stroke="#000" stroke-width="2"/>
  <text x="650" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Neon Postgres DB</text>
  <text x="650" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(Cloud)</text>

  <!-- OpenAI API Box -->
  <rect x="300" y="300" width="200" height="100" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
  <text x="400" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">OpenAI API</text>
  <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(Embeddings, GPT)</text>

  <!-- Arrows -->
  <!-- Docusaurus -> Chatbot -->
  <line x1="150" y1="200" x2="150" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Chatbot -> RAG Backend -->
  <line x1="250" y1="300" x2="300" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- RAG Backend -> Qdrant -->
  <line x1="500" y1="175" x2="550" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- RAG Backend -> Neon -->
  <line x1="500" y1="225" x2="550" y2="275" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- RAG Backend -> OpenAI -->
  <line x1="400" y1="250" x2="400" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- OpenAI -> RAG Backend -->
  <line x1="400" y1="400" x2="400" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Qdrant -> RAG Backend -->
  <line x1="550" y1="150" x2="500" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
</svg>